[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tppa-tpu-polymerization"
version = "0.1.0"
description = "Task-specific TpPa/TPU research workspace"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "rdkit>=2023.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
